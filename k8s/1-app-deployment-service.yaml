apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-infnet
  labels:
    app: todo-infnet-label
spec:
  replicas: 4
  selector:
    matchLabels:
      app: todo-infnet-label
  template:
    metadata:
      labels:
        app: todo-infnet-label
    spec:
      containers:
        - name: todo-infnet
          image: tfsthiagobr98/todo-infnet:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: ConnectionStrings__Default
              value: "Host=postgres-service;Port=5432;Database=tododb;Username=todo;Password=todo123"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: todo-app-service
  labels:
    app: todo-infnet-label
spec:
  type: NodePort
  selector:
    app: todo-infnet-label
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
